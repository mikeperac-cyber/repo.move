<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RepoMove — Repo Moving Checklist</title>
  <meta name="description" content="A to-do list for moving GitHub repos: initial place → target place." />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">◈</div>
        <div>
          <h1>RepoMove</h1>
          <p class="subtitle">Repo moving checklist</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
        <button id="addBtn" class="btn-primary">+ Add</button>
      </div>
    </header>

    <div class="summary" aria-live="polite">
      <span id="summaryText"></span>
      <div class="bar"><div id="progressBar" class="bar-fill"></div></div>
    </div>

    <div class="list-head">
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="Search..." aria-label="Search" autocomplete="off" />
      </div>
      <div class="view-toggle" role="tablist" aria-label="View">
        <button id="listViewBtn" class="toggle active" role="tab" aria-selected="true">List</button>
        <button id="boardViewBtn" class="toggle" role="tab" aria-selected="false">Board</button>
      </div>
    </div>

    <main id="mainView">
      <div id="listView" class="list">
        <!-- items injected; statuses as checkboxes -->
      </div>
      <div id="boardView" class="board hidden">
        <!-- injected -->
      </div>
      <div id="emptyState" class="empty hidden">
        <div class="empty-icon" aria-hidden="true">📦</div>
        <h3>Nothing here yet</h3>
        <p>Add a repo to your move checklist.</p>
        <button id="emptyAddBtn" class="btn-primary">+ Add repo</button>
      </div>
    </main>
  </div>

  <!-- Add / edit dialog -->
  <dialog id="repoDialog" aria-labelledby="dialogTitle">
    <form id="repoForm" novalidate>
      <div class="dialog-head">
        <h2 id="dialogTitle">Add repo</h2>
        <button type="button" class="icon-btn" id="closeDialog" aria-label="Close">✕</button>
      </div>
      <div class="form-grid">
        <label class="span-2">
          <span>Repo name <em>*</em></span>
          <input id="fName" required placeholder="e.g. payment-service" maxlength="80" />
        </label>
        <label>
          <span>Initial place <em>*</em></span>
          <input id="fInitial" required placeholder="github.com/old-org" maxlength="120" />
        </label>
        <label>
          <span>Target place <em>*</em></span>
          <input id="fTarget" required placeholder="github.com/new-org" maxlength="120" />
        </label>
        <label class="span-2">
          <span>GitHub link</span>
          <input id="fLink" type="url" placeholder="https://github.com/org/repo" inputmode="url" />
        </label>
        <label class="span-2">
          <span>Status</span>
          <div class="status-picker">
            <label><input type="radio" name="fStatus" value="planned" checked /> Planned</label>
            <label><input type="radio" name="fStatus" value="in_progress" /> In progress</label>
            <label><input type="radio" name="fStatus" value="done" /> Done</label>
            <label><input type="radio" name="fStatus" value="blocked" /> Blocked</label>
          </div>
        </label>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn-primary" id="saveBtn">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast hidden" role="status" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
